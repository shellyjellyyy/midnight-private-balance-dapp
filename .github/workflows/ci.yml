name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed Compact artifacts exist
        run: |
          for f in \
            managed/counter/compiler/contract-info.json \
            managed/counter/contract/index.js \
            managed/counter/contract/index.d.ts \
            managed/counter/zkir/commitBalance.zkir \
            managed/counter/zkir/getTotalCommitted.zkir \
            managed/counter/keys/commitBalance.prover \
            managed/counter/keys/getTotalCommitted.prover; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required artifact: $f"
              exit 1
            fi
          done
          echo "All committed Compact artifacts verified."
